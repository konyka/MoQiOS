name: Test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Zig 0.16.0
        # 直装官方 tarball：第三方 setup action 的固定 commit 曾被上游改写导致
        # CI 无法解析，自包含下载更稳。
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | sudo tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - run: python3 tools/observe_test_duration.py -- zig build test --summary all

  # QEMU 冒烟门禁：单核 + 双核 boot-to-shell（全部 init 自动测试 + 标记断言）。
  # TCG 软模拟即可（不依赖 /dev/kvm）；Limine 由 limine_bootstrap.sh 按固定
  # commit 克隆构建；disk.img 是跟踪在库的规范 fixture（manifest 校验）。
  smoke-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Zig 0.16.0
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | sudo tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Install QEMU and xorriso
        # Same bounded, retried install as the cross-arch job: a slow Ubuntu mirror once held this step for 20 of the job's 30
        # minutes, leaving the smoke too little time. ipxe-qemu is named explicitly (a recommended package, and the e1000 and virtio
        # network devices need its option ROMs).
        timeout-minutes: 11
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get update && sudo timeout 240 apt-get install -y --no-install-recommends qemu-system-x86 xorriso ipxe-qemu; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out" >&2
            sleep 5
          done
          exit 1
      - name: Smoke SMP=1
        run: zig build smoke
        env:
          MOQI_SMOKE_TIMEOUT: 600
      - name: Smoke SMP=2
        run: zig build smoke-smp
        env:
          MOQI_SMOKE_TIMEOUT: 600

  # Cross-ISA skeleton smoke gates. These are intentionally separate from the
  # x86 ISO smoke: they boot raw ELF images under OpenSBI/QEMU virt and do not
  # need Limine, xorriso, or KVM. Current marker contracts are scoped in the
  # corresponding smoke scripts and must not claim unverified SK-20+ probes.
  smoke-cross-arch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Zig 0.16.0
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | sudo tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Install cross-architecture QEMU
        # Older Ubuntu images ship qemu-system-riscv64 in qemu-system-misc but
        # qemu-system-aarch64 in qemu-system-arm; without the latter the
        # AArch64 step failed on every run ("qemu-system-aarch64 not found").
        # --no-install-recommends keeps the download to the emulators themselves (the recommended packages pull in audio, USB-redirect,
        # Ceph and SPICE libraries that a headless serial smoke never uses). ipxe-qemu has to be named explicitly: it is only a
        # recommendation, and without it qemu-system-aarch64 refuses to start ("failed to find romfile efi-virtio.rom") because the
        # default virtio network device needs that ROM. Each attempt has its own time limit, so a stalled mirror
        # download is abandoned and retried instead of eating the whole job's budget (this step was cancelled by the 15-minute job
        # limit on two consecutive runs while downloading qemu-system-misc).
        timeout-minutes: 11
        run: |
          # On the Ubuntu 26.04 runner image qemu-system-misc installs without qemu-system-riscv64 (run 42131972835: install succeeded,
          # then "qemu-system-riscv64 not found"); the emulator is in the separate package qemu-system-riscv there, and installing that
          # one instead of qemu-system-misc is also a smaller download (41.6 MB in a clean 26.04 container against the 62.9 MB the runner reported). Older images only have qemu-system-misc, so the package is
          # chosen by whether qemu-system-riscv exists. The apt timeout and retry options make a stalled mirror connection give up after
          # 30 seconds and retry, instead of sitting until the 240 second limit of the whole attempt (run 42134669433 lost all three
          # attempts to a stalled download of qemu-system-misc).
          APT="-o Acquire::http::Timeout=30 -o Acquire::Retries=3"
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get $APT update; then
              if apt-cache show qemu-system-riscv >/dev/null 2>&1; then riscv_pkg=qemu-system-riscv; else riscv_pkg=qemu-system-misc; fi
              if sudo timeout 240 apt-get $APT install -y --no-install-recommends "$riscv_pkg" qemu-system-arm ipxe-qemu &&
                 command -v qemu-system-riscv64 >/dev/null && command -v qemu-system-aarch64 >/dev/null; then
                exit 0
              fi
            fi
            echo "apt attempt $attempt failed or timed out" >&2
            sleep 5
          done
          exit 1
      - name: Smoke RISC-V 64
        run: zig build -Darch=riscv64 smoke-riscv
        env:
          MOQI_SMOKE_TIMEOUT: 120
      - name: Smoke AArch64
        run: zig build -Darch=aarch64 smoke-aarch64
        env:
          MOQI_SMOKE_TIMEOUT: 120
