name: Test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Zig 0.16.0
        # 直装官方 tarball：第三方 setup action 的固定 commit 曾被上游改写导致
        # CI 无法解析，自包含下载更稳。
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | sudo tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - run: python3 tools/observe_test_duration.py -- zig build test --summary all

  # QEMU 冒烟门禁：单核 + 双核 boot-to-shell（全部 init 自动测试 + 标记断言）。
  # TCG 软模拟即可（不依赖 /dev/kvm）；Limine 由 limine_bootstrap.sh 按固定
  # commit 克隆构建；disk.img 是跟踪在库的规范 fixture（manifest 校验）。
  smoke-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Zig 0.16.0
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | sudo tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Install QEMU and xorriso
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso
      - name: Smoke SMP=1
        run: zig build smoke
        env:
          MOQI_SMOKE_TIMEOUT: 600
      - name: Smoke SMP=2
        run: zig build smoke-smp
        env:
          MOQI_SMOKE_TIMEOUT: 600
